[project]
name = "wholesale-forecast"
version = "0.1.0"
description = "Wochenprognose und Disposition für einen Großhändler (Online Retail II): Backtest gegen Excel-/ERP-Verfahren und Lagersimulation bei gleicher Lieferbereitschaft."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
wholesale-forecast = "wholesale_forecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wholesale_forecast"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
